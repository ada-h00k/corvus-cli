[package]
name = "corvus-cli"
version = "1.6.8"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "signal-cli compatible JSON-RPC backend for corvus, built on presage"

[[bin]]
name = "corvus-cli"
path = "src/main.rs"

# Kept apart from history-store so its minimal-dependency policy is unaffected.
[dependencies]
# The corvus integration branch of ada-h00k/presage: upstream plus the open pull requests corvus
# needs and corvus' own additions, see README.md. It resolves libsignal-service from the fork's
# contact-aci branch (ac4671b plus the EmbeddedContact aciBinary field), which corvus-cli 1.6.0
# sends and reads so the recipient can message a UUID-only contact.
# cdsi: contact discovery, to find a phone number nobody synced (libsignal-net, BoringSSL)
presage = { git = "https://github.com/ada-h00k/presage", branch = "corvus", features = ["cdsi"] }
presage-store-sqlite = { git = "https://github.com/ada-h00k/presage", branch = "corvus", features = ["cdsi"] }

anyhow = "1.0"
base64 = "0.23"
futures = "0.3"
mime_guess = "2.0"
rand = "0.9"
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt", "io-std", "io-util", "sync", "time", "fs", "signal"] }
tracing = "0.1"
# No default features: "ansi" (stderr is read by corvus, not a terminal) and "tracing-log" are not needed.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
# Encryption of the data at rest (keyring, account index, trust store, SQLite store,
# attachments), the same primitives the GUI's history-store uses: a random master key wrapped
# with Argon2id over the secret, XChaCha20-Poly1305 for the files.
argon2 = { version = "0.6", default-features = false }
chacha20 = { version = "0.10", default-features = false }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }

[dev-dependencies]
# only used to build envelope timestamps in tests
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Same patches as the presage workspace; [patch] does not propagate from dependencies.
[patch.crates-io]
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

# unoptimized ML-KEM can stack-overflow when decrypting PQXDH prekey messages
[profile.dev.package.libcrux-ml-kem]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
