[package]
name = "corvus-signal"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "signal-cli compatible JSON-RPC backend for corvus, built on presage"

[[bin]]
name = "corvus-signal"
path = "src/main.rs"

# Kept apart from history-store so its minimal-dependency policy is unaffected.
[dependencies]
# The corvus integration branch of presage (it uses the one of libsignal-service-rs): upstream plus
# the open pull requests corvus needs and corvus' own additions, see README.md.
# cdsi: contact discovery, to find a phone number nobody synced (libsignal-net, BoringSSL)
presage = { git = "https://github.com/ada-h00k/presage", rev = "4b81740610c301cbd54d95f4dbd4cadd692af95e", features = ["cdsi"] }
presage-store-sqlite = { git = "https://github.com/ada-h00k/presage", rev = "4b81740610c301cbd54d95f4dbd4cadd692af95e", features = ["cdsi"] }

anyhow = "1.0"
base64 = "0.22"
futures = "0.3"
mime_guess = "2.0"
rand = "0.9"
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt", "io-std", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
# No default features: "ansi" (stderr is read by corvus, not a terminal) and "tracing-log" are not needed.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
# only used to build envelope timestamps in tests
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Same patches as the presage workspace; [patch] does not propagate from dependencies.
[patch.crates-io]
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "858ae0a83b7d623563723d58d38c8c4e9298e466" }

# Signal Server now requires the encrypted upload length when requesting a CDN upload form.
# Keep the Corvus-specific presage integration while using the fixed service implementation.
[patch."https://github.com/cyberneticangel/libsignal-service-rs"]
libsignal-service = { git = "https://github.com/ada-h00k/libsignal-service-rs", rev = "7a7526741dfd9ad4c4894717f22651eb0506fb7e" }

# unoptimized ML-KEM can stack-overflow when decrypting PQXDH prekey messages
[profile.dev.package.libcrux-ml-kem]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
