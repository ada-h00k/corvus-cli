[package]
name = "corvus-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "signal-cli compatible JSON-RPC backend for corvus, built on presage"

[[bin]]
name = "corvus-cli"
path = "src/main.rs"

# Kept apart from history-store so its minimal-dependency policy is unaffected.
[dependencies]
# The corvus integration branch of presage (it uses the one of libsignal-service-rs): upstream plus
# the open pull requests corvus needs and corvus' own additions, see README.md. This rev adds the
# lock that serialises session state between sending and receiving (sessions overwritten by a
# concurrent send made incoming messages fail with "invalid Whisper message: decryption failed").
# cdsi: contact discovery, to find a phone number nobody synced (libsignal-net, BoringSSL)
presage = { git = "https://github.com/cyberneticangel/presage", rev = "f0dcc9e1c446bf7117ee6483f1af4454c795c66e", features = ["cdsi"] }
presage-store-sqlite = { git = "https://github.com/cyberneticangel/presage", rev = "f0dcc9e1c446bf7117ee6483f1af4454c795c66e", features = ["cdsi"] }

anyhow = "1.0"
base64 = "0.23"
futures = "0.3"
mime_guess = "2.0"
rand = "0.9"
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt", "io-std", "io-util", "sync", "time", "fs"] }
tracing = "0.1"
# No default features: "ansi" (stderr is read by corvus, not a terminal) and "tracing-log" are not needed.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[dev-dependencies]
# only used to build envelope timestamps in tests
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Same patches as the presage workspace; [patch] does not propagate from dependencies.
[patch.crates-io]
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

# Signal Server now requires the encrypted upload length when requesting a CDN upload form.
# Keep the Corvus-specific presage integration while using the fixed service implementation.
[patch."https://github.com/cyberneticangel/libsignal-service-rs"]
libsignal-service = { git = "https://github.com/ada-h00k/libsignal-service-rs", rev = "ac4671b41fec9f381d24fc60f7c721e01650cf48" }

# unoptimized ML-KEM can stack-overflow when decrypting PQXDH prekey messages
[profile.dev.package.libcrux-ml-kem]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
