name: Build and release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.target }} and publish release
    strategy:
      # One platform failing must not cancel the builds of the others.
      fail-fast: false
      matrix:
        include:
          # macos-latest is an Apple Silicon (arm64) runner.
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: corvus-cli
            asset: corvus-cli-macos-aarch64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: corvus-cli
            asset: corvus-cli-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: corvus-cli.exe
            asset: corvus-cli-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        # Uniform shell (incl. cp and quoted paths) on all three runners.
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake protobuf openssl@3

      - name: Install native build dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc nasm -y

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Tests only on Linux for now; extend the condition to run them on
      # macOS/Windows once those builds are proven green.
      - name: Run tests
        if: runner.os == 'Linux'
        run: cargo test

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release asset
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: commit-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: corvus-cli ${{ github.sha }}
          body: |
            Automated stable build for commit ${{ github.sha }}.

            Source branch: ${{ github.ref_name }}
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
          make_latest: true
