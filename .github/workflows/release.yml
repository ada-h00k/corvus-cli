name: Build and release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.target }} and publish release
    strategy:
      # One platform failing must not cancel the builds of the others.
      fail-fast: false
      matrix:
        include:
          # macos-latest is an Apple Silicon (arm64) runner.
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: corvus-cli
            asset: corvus-cli-macos-aarch64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: corvus-cli
            asset: corvus-cli-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: corvus-cli.exe
            # Zip (not a raw file): SQLCipher links OpenSSL dynamically on
            # Windows, so libcrypto-3-x64.dll must ship next to the exe.
            asset: corvus-cli-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        # Uniform shell (incl. cp and quoted paths) on all three runners.
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake protobuf openssl@3

      - name: Restore vcpkg downloads and binary cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\vcpkg\downloads
            ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-win-x64-

      - name: Install native build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install protoc nasm -y
          # SQLCipher (libsqlite3-sys) links OpenSSL and requires OPENSSL_DIR on
          # Windows. Dynamic triplet: a static libcrypto would clash with the
          # BoringSSL symbols (EVP_*, SHA256, ...) already linked statically
          # via presage/libsignal.
          #
          # Resilience: vcpkg pulls perl, nasm, cmake and the OpenSSL sources
          # from GitHub Releases, which occasionally answers 504. Warm vcpkg's
          # download dir ourselves with patient curl retries (a stale or wrong
          # file is harmless: vcpkg hash-checks and re-downloads on mismatch),
          # retry the install itself, and cache both downloads and built
          # packages so one green run immunizes all later ones.
          export VCPKG_DEFAULT_BINARY_CACHE="$RUNNER_TEMP/vcpkg-binary-cache"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$VCPKG_INSTALLATION_ROOT/downloads"

          fetch() {
            local out="$VCPKG_INSTALLATION_ROOT/downloads/$2"
            if [ -s "$out" ]; then
              echo "already cached: $2"
              return 0
            fi
            if curl --fail --location --silent --show-error \
                 --retry 10 --retry-delay 10 --retry-all-errors \
                 --output "$out.part" "$1"; then
              mv -f "$out.part" "$out"
            else
              echo "::warning::prefetch failed for $2, vcpkg will try its own download"
              rm -f "$out.part"
            fi
          }
          # Pinned to the versions the runner's vcpkg portfiles request today;
          # safe against drift because vcpkg verifies hashes.
          fetch "https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54221_64bit/strawberry-perl-5.42.2.1-64bit-portable.zip" \
                "strawberry-perl-5.42.2.1-64bit-portable.zip"
          fetch "https://github.com/openssl/openssl/archive/openssl-3.6.5.tar.gz" \
                "openssl-openssl-openssl-3.6.5.tar.gz"

          vcpkg_ok=0
          for attempt in 1 2 3; do
            echo "::group::vcpkg install openssl (attempt $attempt/3)"
            if vcpkg install openssl --triplet x64-windows; then
              vcpkg_ok=1
            fi
            echo "::endgroup::"
            if [ "$vcpkg_ok" -eq 1 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "vcpkg attempt $attempt failed; retrying in 60 s ..."
              sleep 60
            fi
          done
          if [ "$vcpkg_ok" -ne 1 ]; then
            echo "vcpkg install failed after 3 attempts"
            exit 1
          fi

          VCPKG_INSTALLED="$VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          {
            echo "OPENSSL_DIR=$VCPKG_INSTALLED"
            echo "OPENSSL_LIB_DIR=$VCPKG_INSTALLED/lib"
            echo "OPENSSL_INCLUDE_DIR=$VCPKG_INSTALLED/include"
          } >> "$GITHUB_ENV"

      - name: Save vcpkg downloads and binary cache (Windows)
        if: always() && runner.os == 'Windows'
        uses: actions/cache/save@v4
        with:
          path: |
            C:\vcpkg\downloads
            ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-win-x64-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Tests only on Linux for now; extend the condition to run them on
      # macOS/Windows once those builds are proven green.
      - name: Run tests
        if: runner.os == 'Linux'
        run: cargo test

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release asset (Linux, macOS)
        if: runner.os != 'Windows'
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Prepare release asset (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/"libcrypto*.dll dist/
          (cd dist && 7z a -tzip "../${{ matrix.asset }}" .)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: commit-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: corvus-cli ${{ github.sha }}
          body: |
            Automated stable build for commit ${{ github.sha }}.

            Source branch: ${{ github.ref_name }}
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
          make_latest: true
