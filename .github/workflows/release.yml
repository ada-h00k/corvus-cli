name: Build and release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Linux x86_64 and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare release asset
        run: cp target/release/corvus-signal corvus-signal-linux-x86_64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: commit-${{ github.sha }}
          name: corvus-signal ${{ github.sha }}
          body: |
            Automated build for commit ${{ github.sha }}.

            Source branch: ${{ github.ref_name }}
          files: corvus-signal-linux-x86_64
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
          make_latest: false
