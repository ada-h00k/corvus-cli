name: Build and release

on:
  push:
    branches:
      - "**"
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Least privilege (L3): the default for every job is read-only; only the release
# publication needs write access, and only the attestation needs to sign.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      # One platform failing must not cancel the builds of the others.
      fail-fast: false
      matrix:
        include:
          # macos-latest is an Apple Silicon (arm64) runner.
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: corvus-cli
            asset: corvus-cli-macos-aarch64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: corvus-cli
            asset: corvus-cli-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: corvus-cli.exe
            # Zip (not a raw file): SQLCipher links OpenSSL dynamically on
            # Windows, so libcrypto-3-x64.dll must ship next to the exe.
            asset: corvus-cli-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        # Uniform shell (incl. cp and quoted paths) on all three runners.
        shell: bash
    permissions:
      # Read-only for every branch push; the attestation signs in the publish job, which
      # only runs on tags (L3 follow-up: these write scopes were requested here on every
      # push while the attestation step only ever ran on a tag).
      contents: read

    steps:
      - name: Check out source
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install native build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            libsqlite3-dev \
            pkg-config \
            protobuf-compiler

      - name: Install native build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake protobuf openssl@3

      - name: Restore vcpkg downloads and binary cache (Windows)
        if: runner.os == 'Windows'
        # actions/cache/restore@v6
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            C:\vcpkg\downloads
            ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-win-x64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-win-x64-

      - name: Install native build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install protoc nasm -y
          # SQLCipher (libsqlite3-sys) links OpenSSL and requires OPENSSL_DIR on
          # Windows. Dynamic triplet: a static libcrypto would clash with the
          # BoringSSL symbols (EVP_*, SHA256, ...) already linked statically
          # via presage/libsignal.
          #
          # Resilience: vcpkg pulls perl, nasm, cmake and the OpenSSL sources
          # from GitHub Releases, which occasionally answers 504. Warm vcpkg's
          # download dir ourselves with patient curl retries (a stale or wrong
          # file is harmless: vcpkg hash-checks and re-downloads on mismatch),
          # retry the install itself, and cache both downloads and built
          # packages so one green run immunizes all later ones.
          export VCPKG_DEFAULT_BINARY_CACHE="$RUNNER_TEMP/vcpkg-binary-cache"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$VCPKG_INSTALLATION_ROOT/downloads"

          # The shared downloads cache can contain a partially extracted vcpkg Perl tool.
          # Remove it so vcpkg reinstalls a complete copy before configuring OpenSSL.
          rm -rf "$VCPKG_INSTALLATION_ROOT/downloads/tools/perl"
          rm -f "$VCPKG_INSTALLATION_ROOT/downloads/strawberry-perl-5.42.2.1-64bit-portable.zip"

          fetch() {
            local out="$VCPKG_INSTALLATION_ROOT/downloads/$2"
            if [ -s "$out" ]; then
              echo "already cached: $2"
              return 0
            fi
            if curl --fail --location --silent --show-error \
                 --retry 10 --retry-delay 10 --retry-all-errors \
                 --output "$out.part" "$1"; then
              mv -f "$out.part" "$out"
            else
              echo "::warning::prefetch failed for $2, vcpkg will try its own download"
              rm -f "$out.part"
            fi
          }
          # Pinned to the versions the runner's vcpkg portfiles request today;
          # safe against drift because vcpkg verifies hashes.
          fetch "https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54221_64bit/strawberry-perl-5.42.2.1-64bit-portable.zip" \
                "strawberry-perl-5.42.2.1-64bit-portable.zip"
          fetch "https://github.com/openssl/openssl/archive/openssl-3.6.5.tar.gz" \
                "openssl-openssl-openssl-3.6.5.tar.gz"

          vcpkg_ok=0
          for attempt in 1 2 3; do
            echo "::group::vcpkg install openssl (attempt $attempt/3)"
            if vcpkg install openssl --triplet x64-windows; then
              vcpkg_ok=1
            fi
            echo "::endgroup::"
            if [ "$vcpkg_ok" -eq 1 ]; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::vcpkg attempt $attempt failed; retrying in 60 s ..."
              sleep 60
            fi
          done
          if [ "$vcpkg_ok" -ne 1 ]; then
            echo "::error::vcpkg install failed after 3 attempts"
            exit 1
          fi

          VCPKG_INSTALLED="$VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          {
            echo "OPENSSL_DIR=$VCPKG_INSTALLED"
            echo "OPENSSL_LIB_DIR=$VCPKG_INSTALLED/lib"
            echo "OPENSSL_INCLUDE_DIR=$VCPKG_INSTALLED/include"
          } >> "$GITHUB_ENV"

      - name: Save vcpkg downloads and binary cache (Windows)
        if: always() && runner.os == 'Windows'
        # actions/cache/save@v6
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            C:\vcpkg\downloads
            ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-win-x64-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install Rust
        # dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        # Swatinem/rust-cache@v2.9.3 — the commit the v2 tag object points to (L3 follow-up:
        # the annotated tag's own SHA moves with a re-tag; the commit does not).
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: ${{ matrix.target }}

      # Tests only on Linux for now; extend the condition to run them on
      # macOS/Windows once those builds are proven green.
      - name: Run tests
        if: runner.os == 'Linux'
        run: cargo test

      # Advisory check (L3): a known CVE in the dependency tree fails the build. The version
      # is pinned so a new release cannot change the audit's behavior between runs.
      - name: Check dependencies for known advisories
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked --version '=0.23.0'
          cargo audit

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release asset (Linux, macOS)
        if: runner.os != 'Windows'
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Prepare release asset (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/"libcrypto*.dll dist/
          (cd dist && 7z a -tzip "../${{ matrix.asset }}" .)

      # The build provenance is attested in the publish job (L3 follow-up: the signing
      # permissions only exist there, and that job only runs on tags).

      - name: Upload release asset
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          archive: false
          if-no-files-found: error
          retention-days: 1

  build-arch-package:
    name: Package Linux binary for Arch
    # Package the already-built Linux binary; do not compile Rust a second time.
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: archlinux:base-devel
    steps:
      - name: Install minimal Arch packaging dependencies
        run: pacman -Syu --noconfirm --needed shadow

      - name: Check out source
        # actions/checkout@v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Linux binary from build job
        # actions/download-artifact@v8
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: corvus-cli-linux-x86_64
          path: dist

      - name: Prepare binary and build Arch package
        run: |
          install -Dm755 dist/corvus-cli-linux-x86_64 ./corvus-cli
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- makepkg --cleanbuild --noconfirm

      - name: Upload Arch Linux package
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arch-linux-package
          path: '*.pkg.tar.zst'
          archive: false
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub release
    needs: [build, build-arch-package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      # The one job that may write: it creates the release, and the attestation signs
      # there (L3 follow-up: the signing scopes moved here from the build job, which ran
      # them on every branch push without ever using them).
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        # actions/download-artifact@v8
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release-assets
          merge-multiple: true

      - name: Attest build provenance
        # actions/attest-build-provenance@v3.0.0 — the commit the v3 tag object points to
        # (L3 follow-up: the pin was the annotated tag's own SHA). The subject names come
        # from the matched paths.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release-assets/*

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        # softprops/action-gh-release@v3.0.4 — the commit the v3 tag object points to
        # (L3 follow-up: the pin was the annotated tag's own SHA).
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          tag_name: ${{ github.ref_name }}
          name: corvus-cli ${{ github.ref_name }}
          body: |
            corvus-cli version ${{ github.ref_name }}.

            Commit: ${{ github.sha }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
          make_latest: true
